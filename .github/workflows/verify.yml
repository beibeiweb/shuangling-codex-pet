name: Verify Windows package
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python voice/notify.py --self-test
      - shell: powershell
        run: |
          ./upstream/dragon-codex-boot/scripts/build.ps1 -IconPath launcher/media/shuangling.ico
          ./upstream/dragon-codex-boot/scripts/test.ps1
